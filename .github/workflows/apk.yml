name: Signed Android release
on:
  push:
    branches: [main]
    paths: ['app/**', 'android-platform/**', 'control-core/**', 'fixture/**', '*.kts', 'gradle/**', 'gradle.properties', '.github/workflows/**', 'scripts/prepare_ngrok_native.sh', 'scripts/check_apk.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APK_KEYSTORE: /tmp/pocket-mcp-signing.jks
      APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
      APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore private release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key=Path(os.environ['APK_KEYSTORE'])
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          key.chmod(0o600)
          PY
      - name: Prepare pinned Android ngrok libraries
        run: bash scripts/prepare_ngrok_native.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile signed release and isolated test fixture
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease :fixture:assembleDebug
      - name: Verify and collect distribution artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk artifacts/Pocket-MCP-arm64.apk
          cp app/build/outputs/apk/release/app-universal-release.apk artifacts/Pocket-MCP-universal.apk
          cp fixture/build/outputs/apk/debug/fixture-debug.apk artifacts/Pocket-MCP-test-fixture.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/Pocket-MCP-arm64.apk > artifacts/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/Pocket-MCP-universal.apk
          python3 scripts/check_apk.py artifacts/Pocket-MCP-arm64.apk artifacts/Pocket-MCP-universal.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          cp app/build/reports/lint-results-release.txt artifacts/lint.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-mcp-release
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$APK_KEYSTORE"
