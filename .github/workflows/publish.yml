name: Publish existing APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful APK build run ID
        required: true
        default: '38468387302'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocket-mcp-release
          path: apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish existing initial release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd apk
          sha256sum Pocket-MCP-arm64.apk Pocket-MCP-universal.apk > SHA256SUMS.txt
          gh release upload v0.1.0 Pocket-MCP-arm64.apk Pocket-MCP-universal.apk SHA256SUMS.txt --clobber
          gh release edit v0.1.0 --draft=false --prerelease
